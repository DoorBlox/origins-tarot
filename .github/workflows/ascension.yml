name: Build Tarot Club V3 Path of Ascension
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-v3:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python3 -m compileall -q progression tests
      - name: Run V2 regression and V3 progression tests
        run: python3 -m unittest discover -s tests -v
      - name: Build both installable variants
        run: python3 -m progression.build
      - name: Upload V3 datapacks
        uses: actions/upload-artifact@v4
        with:
          name: tarot-club-v3-ascension
          path: |
            output/The_Tarot_Club_V3_Ascension_ONLY_1.18.2.zip
            output/The_Tarot_Club_V3_Ascension_ADDON_1.18.2.zip
          if-no-files-found: error
