name: Build Arcane V2 Rev3 22-Origin Dev Pack
on:
  push:
    branches:
      - main
      - 'feat/arcane-rev3-*'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build both 22-Origin developer variants and non-OP aliases
        run: python3 -m arcane_rev3.full_build
      - name: Attach exact source SHA to development artifact
        run: printf "%s\\n" "${GITHUB_SHA}" > output/ARCANE_REV3_BUILD_SHA.txt
      - name: Display exact ability implementation coverage
        run: python3 -c 'import json; print(json.load(open("output/arcane_ability_manifest.json"))["summary"])'
      - name: Check 434 handbook entries and scoreboard security contracts
        run: python3 -m unittest discover -s tests -p 'test_arcane_full.py' -v
      - name: Run legacy V2/V3/Rev3 structural regressions
        run: python3 -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: tarot-arcane-rev3-22-origin-dev-not-production
          path: |
            output/Arcane_Rev3_22_Origins_ONLY_DEV_1.18.2.zip
            output/Arcane_Rev3_22_Origins_ADDON_DEV_1.18.2.zip
            output/Arcane_Rev3_Resonance_Manual_Preview_TEST_ONLY_1.18.2.zip
            output/arcane_ability_manifest.json
            output/tarot.json
            output/ARCANE_REV3_BUILD_SHA.txt
          if-no-files-found: error
