name: Generate Arcane Player Wiki
on:
  push:
    branches:
      - docs/arcane-player-wiki-20261122
    paths:
      - tools/build_player_wiki.py
      - .github/workflows/arcane-player-wiki.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-player-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile latest player-facing Arcane reference
        run: python -m arcane_rev3.full_build
      - name: Generate and verify 22 pathway pages, links and indexes
        run: |
          python tools/build_player_wiki.py
          python tools/build_player_wiki.py --check
      - name: Commit rendered documentation on the documentation branch only
        if: github.ref_name == 'docs/arcane-player-wiki-20261122'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/player/
          if ! git diff --cached --quiet; then
            git commit -m 'docs: render source-compiled player handbook and 22 pathways'
            git push origin "HEAD:docs/arcane-player-wiki-20261122"
          fi
